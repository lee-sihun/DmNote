[package]
name = "dm-note"
version = "1.6.1"
edition = "2021"
rust-version = "1.88"
default-run = "dm-note"

[features]
asio-backend = ["dep:cpal"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
walkdir = "2.5"
zip = "0.6"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
minisign-verify = "0.2.5"
thiserror = "1.0"
parking_lot = "0.12"
log = "0.4"
notify = "6.1"
notify-debouncer-mini = "0.4"
fern = { version = "0.6", features = ["colored"] }
tauri = { version = "~2.11.5", features = ["wry", "devtools", "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-runtime-wry = { version = "~2.11.4", features = ["devtools"] }
tauri-plugin-single-instance = "2"
once_cell = "1.19"
open = "5.1"
rfd = "0.14"
dirs-next = "2.0"
uuid = { version = "1", features = ["v4"] }
url = "2"
unicode-normalization = "0.1"
zip = "0.6"
sha2 = "0.10"
rodio = { git = "https://github.com/lee-sihun/rodio", rev = "7b771e15", default-features = false, features = ["playback"] }
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "wav", "aiff", "mp3", "isomp4", "aac", "pcm", "adpcm", "flac", "alac"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
local-ip-address = "0.6.10"
ttf-parser = "0.25.1"
wuff = "0.2.8"

[dev-dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
cpal = { version = "0.17.3", optional = true, default-features = false, features = ["asio"] }
windows = { version = "0.61.3", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Input",
	"Win32_Devices_HumanInterfaceDevice",
	"Win32_Storage_FileSystem",
	"Win32_System_Threading",
	"Win32_System_Pipes",
	"Win32_System_LibraryLoader",
	"Win32_System_IO",
	"Win32_System_Registry",
	"Win32_Security",
	"Win32_UI_Shell"
] }
thread-priority = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
semver = "1"
self-replace = "1.5"
tempfile = "3"

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"
rdev = "0.5.3"
objc = "0.2"
objc2 = "0.6"
objc-foundation = "0.1"
cocoa = "0.22"
thread-priority = "1.2"

# objc 크레이트의 매크로에서 발생하는 cfg 경고 억제
[lints.rust]
unexpected_cfgs = "allow"

# Release 프로필 최적화 (메모리/바이너리 크기 감소)
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"  # 's'보다 더 공격적인 크기 최적화
strip = true
panic = "unwind" # macOS Objective-C 예외 포착에 필요

# 빌드 시 release 의존성도 최적화
[profile.release.package."*"]
opt-level = "z"
strip = true
