name: Main Quality
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Main Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/quality
