name: Release Windows

# Windows x64 빌드 -> 포터블 ZIP 패키징 -> draft 릴리즈 첨부
# - main의 npm version 커밋: 운영 인증서 활성화 전까지 서명을 건너뛴 EXE/ZIP을 draft 릴리즈에 업로드
# - workflow_dispatch(release=true): 현재 버전을 수동 릴리즈
# - workflow_dispatch(release=false): SignPath 테스트 서명 후 Actions artifact로만 업로드
# - 단독 업데이트 EXE와 ZIP 내부 EXE는 같은 빌드 파일을 사용

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      release:
        description: "현재 버전을 draft 릴리즈에 업로드 (false면 SignPath 테스트 서명)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: 설정·버전 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # 빌드 전에 원격 릴리스 태그 생성
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      test_signing: ${{ steps.check.outputs.test_signing }}
      should_build: ${{ steps.check.outputs.should_build }}
      release_sha: ${{ steps.check.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SignPath 설정 확인
        if: github.event_name == 'workflow_dispatch' && inputs.release != true
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          set -euo pipefail
          MISSING=""
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_ARTIFACT_CONFIGURATION_SLUG; do
            [ -n "${!name}" ] || MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::SignPath 설정 누락:$MISSING — docs/release_windows.md 참고"
            exit 1
          fi
          echo "SignPath 필수 설정 확인"

      - id: check
        name: 실행 모드·버전 확인
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_RELEASE: ${{ inputs.release }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          PKG="$(node -p "require('./package.json').version")"
          CONF="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO="$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"
          if [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::버전 불일치 — npm run sync-version 실행 후 다시 시도"
            exit 1
          fi

          RELEASE=false
          TEST_SIGNING=false
          SHOULD_BUILD=false
          RELEASE_SHA="$CURRENT_SHA"
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::버전 릴리즈는 기본 브랜치($DEFAULT_BRANCH) push에서만 허용"
              exit 1
            fi

            SUBJECT="$(git log -1 --format=%s "$CURRENT_SHA")"
            PREVIOUS_PKG="$(git show "$BEFORE_SHA:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))" || true)"
            if [ "$SUBJECT" = "$PKG" ] && [ -n "$PREVIOUS_PKG" ] && [ "$PREVIOUS_PKG" != "$PKG" ]; then
              RELEASE=true
              SHOULD_BUILD=true
              echo "npm version 커밋 감지: $PREVIOUS_PKG -> $PKG"
            else
              echo "package.json 변경이 npm version 커밋이 아님 — 릴리즈 빌드 생략 (subject=$SUBJECT previous=$PREVIOUS_PKG current=$PKG)"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_TYPE" != "branch" ] || [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::수동 실행은 기본 브랜치($DEFAULT_BRANCH)에서만 가능"
              exit 1
            fi
            SHOULD_BUILD=true
            if [ "$MANUAL_RELEASE" = "true" ]; then
              RELEASE=true
              RELEASE_SHA="$(git log --format='%H%x09%s' -- package.json | awk -F '\t' -v expected="$PKG" '$2 == expected && !found { print $1; found=1 }')"
              if [ -z "$RELEASE_SHA" ]; then
                echo "::error::버전 커밋 '$PKG'를 찾을 수 없음"
                exit 1
              fi
              RELEASE_PKG="$(git show "$RELEASE_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
              if [ "$RELEASE_PKG" != "$PKG" ]; then
                echo "::error::버전 커밋 검증 실패: sha=$RELEASE_SHA package=$RELEASE_PKG expected=$PKG"
                exit 1
              fi
            else
              TEST_SIGNING=true
            fi
          else
            echo "::error::지원하지 않는 이벤트: $EVENT_NAME"
            exit 1
          fi

          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "test_signing=$TEST_SIGNING" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE test_signing=$TEST_SIGNING should_build=$SHOULD_BUILD release_sha=$RELEASE_SHA"

      - name: 릴리스 태그 확인 / 생성
        if: steps.check.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.version }}
          TARGET: ${{ steps.check.outputs.release_sha }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local commit
            if commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)"; then
              printf '%s\n' "$commit"
            fi
          }

          EXISTING="$(resolve_tag_commit)"
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" != "$TARGET" ]; then
              echo "::error::원격 태그 $TAG 대상 불일치: actual=$EXISTING expected=$TARGET"
              exit 1
            fi
            echo "기존 원격 태그 확인: $TAG -> $TARGET"
            exit 0
          fi

          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${TARGET}" >/dev/null; then
            echo "태그 생성 경합 감지 — 원격 태그 재확인"
            EXISTING="$(resolve_tag_commit)"
            if [ "$EXISTING" != "$TARGET" ]; then
              echo "::error::원격 태그 생성 실패: tag=$TAG actual=${EXISTING:-missing} expected=$TARGET"
              exit 1
            fi
          fi
          echo "원격 태그 생성 완료: $TAG -> $TARGET"

  build-sign-package:
    name: Windows 빌드·패키징
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    concurrency:
      group: release-windows
      cancel-in-progress: false
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write # draft 릴리즈 생성·자산 업로드
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SIGNING_POLICY_SLUG: test-signing
      TEST_SIGNING: ${{ needs.preflight.outputs.test_signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: stable

      - name: Windows 빌드 도구 확인
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          $libclang = Join-Path $llvmBin 'libclang.dll'
          if (-not (Test-Path -LiteralPath $libclang -PathType Leaf)) {
            throw "libclang.dll을 찾을 수 없습니다: $libclang"
          }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          rustc --version
          cargo --version
          node --version
          npm --version

      - run: npm ci

      # 자동 업데이트 자산과 포터블 ZIP이 공유할 raw EXE를 한 번만 빌드
      - name: Windows x64 빌드
        run: npm run tauri:build -- --no-bundle

      - name: 빌드 산출물 준비
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceExe = 'src-tauri\target\release\dm-note.exe'
          if (-not (Test-Path -LiteralPath $sourceExe -PathType Leaf)) {
            throw "빌드 EXE를 찾을 수 없습니다: $sourceExe"
          }

          $versionInfo = (Get-Item -LiteralPath $sourceExe).VersionInfo
          if ($versionInfo.ProductName -ne 'DM NOTE') {
            throw "ProductName 불일치: $($versionInfo.ProductName)"
          }
          if ($versionInfo.ProductVersion -ne $env:VERSION -or $versionInfo.FileVersion -ne $env:VERSION) {
            throw "EXE 버전 불일치: product=$($versionInfo.ProductVersion) file=$($versionInfo.FileVersion) expected=$env:VERSION"
          }

          $inputDir = 'dist\signing-input'
          New-Item -ItemType Directory -Path $inputDir | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination (Join-Path $inputDir 'DM.NOTE.exe')

      # GitHub artifact가 ZIP 래퍼를 만들므로 SignPath Artifact Configuration의 루트는 <zip-file>
      - name: 미서명 EXE 업로드
        if: needs.preflight.outputs.test_signing == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: dmnote-windows-unsigned-${{ env.VERSION }}
          path: dist/signing-input/DM.NOTE.exe
          if-no-files-found: error
          retention-days: 3

      - name: SignPath 테스트 서명
        if: needs.preflight.outputs.test_signing == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/signing-output
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: 테스트 서명 검증
        if: needs.preflight.outputs.test_signing == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedExe = 'dist\signing-output\DM.NOTE.exe'
          if (-not (Test-Path -LiteralPath $signedExe -PathType Leaf)) {
            throw "SignPath 출력 EXE를 찾을 수 없습니다: $signedExe"
          }

          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter 'signtool.exe' -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw 'Windows SDK signtool.exe를 찾을 수 없습니다.'
          }

          "Authenticode 검증 시작: $($signTool.FullName)"
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $signTool.FullName
          $startInfo.UseShellExecute = $false
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          foreach ($argument in @('verify', '/pa', '/v', $signedExe)) {
            $startInfo.ArgumentList.Add($argument)
          }

          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          try {
            if (-not $process.Start()) {
              throw 'signtool.exe 실행에 실패했습니다.'
            }

            $standardOutput = $process.StandardOutput.ReadToEndAsync()
            $standardError = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(120000)) {
              $process.Kill($true)
              $process.WaitForExit()
              throw 'Authenticode 검증이 120초를 초과했습니다.'
            }

            $verificationOutput = ($standardOutput.GetAwaiter().GetResult() + $standardError.GetAwaiter().GetResult()).Trim()
            $verificationOutput
            $verificationExitCode = $process.ExitCode
          }
          finally {
            $process.Dispose()
          }

          # 테스트 인증서는 자체 서명이므로 파일·서명 검증 후 미신뢰 루트 오류 하나만 허용
          $expectedTestTrustFailure =
            $env:SIGNING_POLICY_SLUG -eq 'test-signing' -and
            $verificationExitCode -eq 1 -and
            $verificationOutput -match 'Signature Index:\s+0' -and
            $verificationOutput -match 'Hash of file \(sha256\):\s+[0-9A-F]{64}' -and
            $verificationOutput -match 'Number of errors:\s+1' -and
            $verificationOutput -match 'terminated in a root\s+certificate which is not trusted by the trust provider'

          if ($verificationExitCode -ne 0 -and -not $expectedTestTrustFailure) {
            throw "Authenticode 검증 실패: signtool 종료 코드 $verificationExitCode"
          }

          if ($expectedTestTrustFailure) {
            'Authenticode 서명과 파일 무결성 확인 완료 (자체 서명 테스트 루트 미신뢰는 예상된 상태)'
          }

      # 테스트 실행은 서명 완료 EXE, 버전 릴리즈는 동일 빌드의 미서명 EXE로 패키징
      - name: 최종 자산 패키징
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseExe = if ($env:TEST_SIGNING -eq 'true') {
            'dist\signing-output\DM.NOTE.exe'
          }
          else {
            'dist\signing-input\DM.NOTE.exe'
          }
          if (-not (Test-Path -LiteralPath $releaseExe -PathType Leaf)) {
            throw "패키징할 EXE를 찾을 수 없습니다: $releaseExe"
          }

          $packageDir = 'dist\windows-package'
          $finalDir = 'dist\windows-final'
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Path $finalDir | Out-Null

          Copy-Item -LiteralPath $releaseExe -Destination (Join-Path $finalDir 'DM.NOTE.exe')
          Copy-Item -LiteralPath $releaseExe -Destination (Join-Path $packageDir 'dm-note.exe')
          $releaseAssets = 'distribution\windows\assets'
          if (-not (Test-Path -LiteralPath $releaseAssets -PathType Container)) {
            throw "Windows 배포 자산 폴더를 찾을 수 없습니다: $releaseAssets"
          }

          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.txt' -Destination $packageDir
          Copy-Item -LiteralPath $releaseAssets -Destination $packageDir -Recurse

          $zipPath = Join-Path $finalDir "DM.NOTE.v.$env:VERSION.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -CompressionLevel Optimal

          $verifyDir = Join-Path $env:RUNNER_TEMP 'dmnote-windows-zip-verify'
          New-Item -ItemType Directory -Path $verifyDir | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir
          $standaloneHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $finalDir 'DM.NOTE.exe')).Hash
          $packagedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $verifyDir 'dm-note.exe')).Hash
          if ($standaloneHash -ne $packagedHash) {
            throw "단독 EXE와 ZIP 내부 EXE 해시 불일치: $standaloneHash != $packagedHash"
          }

          "DM.NOTE.exe SHA-256: $standaloneHash"
          Get-ChildItem -LiteralPath $finalDir | Select-Object Name, Length

      - name: 테스트 서명 산출물 업로드
        if: needs.preflight.outputs.test_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dmnote-windows-test-signed-${{ env.VERSION }}
          path: dist/windows-final/*
          if-no-files-found: error
          retention-days: 7

      - name: draft 릴리즈 생성 / Windows 자산 업로드
        if: needs.preflight.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          EXE_PATH="dist/windows-final/DM.NOTE.exe"
          ZIP_PATH="dist/windows-final/DM.NOTE.v.${VERSION}.zip"
          NOTES_PATH="$RUNNER_TEMP/release-notes-${VERSION}.md"

          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/docs/releases/${VERSION}_ko.md?ref=main" \
            > "$NOTES_PATH"

          upload_to_existing_release() {
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::릴리즈 $TAG 는 이미 publish됨 — 자동 덮어쓰기 거부. 필요하면 gh release upload --clobber 로 수동 교체"
              exit 1
            fi
            echo "기존 draft 릴리즈 발견 — Windows 자산 덮어쓰기"
            gh release upload "$TAG" "$EXE_PATH" "$ZIP_PATH" --clobber
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            upload_to_existing_release
          else
            if ! gh release create "$TAG" "$EXE_PATH" "$ZIP_PATH" \
              --verify-tag --draft --title "DM NOTE v $VERSION" --notes-file "$NOTES_PATH"; then
              echo "draft 생성 경합 감지 — 기존 릴리즈 재확인"
              gh release view "$TAG" >/dev/null
              upload_to_existing_release
            fi
          fi

          gh release view "$TAG" --json isDraft,name,assets \
            --jq '"draft=\(.isDraft) name=\(.name) assets=\([.assets[].name] | join(", "))"'

      - name: 테스트 서명 실행 요약
        if: needs.preflight.outputs.test_signing == 'true'
        shell: pwsh
        env:
          SIGNING_REQUEST_URL: ${{ steps.signpath.outputs.signing-request-web-url }}
        run: |
          @"
          ## Windows test signing 완료

          - Version: ``$env:VERSION``
          - Policy: ``$env:SIGNING_POLICY_SLUG``
          - Signing Request: $env:SIGNING_REQUEST_URL
          - 테스트 인증서 산출물은 GitHub Release에 게시하지 않음
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: unsigned 릴리즈 실행 요약
        if: needs.preflight.outputs.release == 'true'
        shell: pwsh
        run: |
          @"
          ## Windows draft 릴리즈 업로드 완료

          - Version: ``$env:VERSION``
          - Signing: 운영 인증서 활성화 전 임시 미서명
          - Assets: ``DM.NOTE.exe``, ``DM.NOTE.v.$env:VERSION.zip``
          "@ >> $env:GITHUB_STEP_SUMMARY
