name: windows 검증
description: 전체 Rust 테스트와 Tauri 앱 검증
inputs:
  workspace:
    description: 검사할 소스 checkout 경로
    default: '.'
  extended:
    description: 배포 형식과 추가 구성 검증
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
      with:
        workspace: ${{ inputs.workspace }}
    - uses: ./.github/actions/setup-native
      with:
        workspace: ${{ inputs.workspace }}
        cache-key: windows-asio-${{ inputs.extended == 'true' && 'release' || 'debug' }}
    - name: nextest 준비
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '0.9.143'
        $archive = Join-Path $env:RUNNER_TEMP 'cargo-nextest.zip'
        $destination = Join-Path $env:RUNNER_TEMP 'dmnote-nextest'
        Invoke-WebRequest "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-x86_64-pc-windows-msvc.zip" -OutFile $archive
        if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'c670ba18e8731fd2eff33a47af33a0fa53d1afa6d0678344e82dc6f8fc7344ac') {
          throw 'nextest SHA256 불일치'
        }
        Expand-Archive $archive -DestinationPath $destination -Force
        Remove-Item $archive
        $destination >> $env:GITHUB_PATH
        & (Join-Path $destination 'cargo-nextest.exe') nextest --version
    - shell: bash
      working-directory: ${{ inputs.workspace }}
      run: npm ci --no-audit --no-fund
    - name: ASIO Clippy
      shell: bash
      working-directory: ${{ inputs.workspace }}/src-tauri
      run: cargo clippy --all-targets --locked --features asio-backend -- -D warnings
    - name: ASIO 전체 Rust 테스트
      shell: bash
      working-directory: ${{ inputs.workspace }}/src-tauri
      run: cargo nextest run --all-targets --locked --features asio-backend --no-fail-fast --no-tests=fail --retries 0
    - name: PR 앱 빌드
      working-directory: ${{ inputs.workspace }}
      shell: bash
      if: inputs.extended != 'true'
      run: npm run tauri:build -- --debug --no-bundle --ci -- --locked
    - name: 배포 profile 빌드
      working-directory: ${{ inputs.workspace }}
      shell: bash
      if: inputs.extended == 'true'
      run: npm run tauri:build -- --no-bundle --ci -- --locked
    - name: ASIO 미사용 구성과 doctest
      if: inputs.extended == 'true'
      working-directory: ${{ inputs.workspace }}/src-tauri
      shell: bash
      run: |
        cargo clippy --all-targets --locked -- -D warnings
        cargo nextest run --all-targets --locked --no-fail-fast --no-tests=fail --retries 0
        cargo test --doc --locked
        cargo test --doc --locked --features asio-backend
    - name: ASIO 미사용 배포 빌드
      working-directory: ${{ inputs.workspace }}
      shell: bash
      if: inputs.extended == 'true'
      run: npm run tauri:build:no-asio -- --no-bundle --ci -- --locked
    - name: 생성 permissions 확인
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: git diff --exit-code -- src-tauri/permissions/dmnote-allow-all.json
