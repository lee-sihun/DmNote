name: windows 검증
description: 전체 Rust 테스트와 Tauri 앱 검증
inputs:
  workspace:
    description: 검사할 소스 checkout 경로
    default: '.'
  extended:
    description: 배포 형식과 추가 구성 검증
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node
      with:
        workspace: ${{ inputs.workspace }}
    - uses: ./.github/actions/setup-native
      with:
        workspace: ${{ inputs.workspace }}
        cache-key: windows-asio-${{ inputs.extended == 'true' && 'release' || 'debug' }}
    - shell: bash
      working-directory: ${{ inputs.workspace }}
      run: npm ci --no-audit --no-fund
    - name: ASIO Clippy
      shell: bash
      working-directory: ${{ inputs.workspace }}/src-tauri
      run: cargo clippy --all-targets --locked --features asio-backend -- -D warnings
    - name: ASIO 전체 Rust 테스트
      shell: bash
      working-directory: ${{ inputs.workspace }}/src-tauri
      run: cargo test --all-targets --locked --features asio-backend -- --test-threads=1 --nocapture
    - name: Windows 충돌 진단
      if: failure()
      shell: pwsh
      run: |
        Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue | Format-List Message
    - name: PR 앱 빌드
      working-directory: ${{ inputs.workspace }}
      shell: bash
      if: inputs.extended != 'true'
      run: npm run tauri:build -- --debug --no-bundle --ci -- --locked
    - name: 배포 profile 빌드
      working-directory: ${{ inputs.workspace }}
      shell: bash
      if: inputs.extended == 'true'
      run: npm run tauri:build -- --no-bundle --ci -- --locked
    - name: ASIO 미사용 구성과 doctest
      if: inputs.extended == 'true'
      working-directory: ${{ inputs.workspace }}/src-tauri
      shell: bash
      run: |
        cargo clippy --all-targets --locked -- -D warnings
        cargo test --all-targets --locked
        cargo test --doc --locked
        cargo test --doc --locked --features asio-backend
    - name: ASIO 미사용 배포 빌드
      working-directory: ${{ inputs.workspace }}
      shell: bash
      if: inputs.extended == 'true'
      run: npm run tauri:build:no-asio -- --no-bundle --ci -- --locked
    - name: 생성 permissions 확인
      working-directory: ${{ inputs.workspace }}
      shell: bash
      run: git diff --exit-code -- src-tauri/permissions/dmnote-allow-all.json
